name: flutter_readium
description: >-
  Flutter plugin for EPUB, PDF, audiobook, comic, and WebPub reading with a unified
  Dart API, powered by Readium's toolkits for iOS, Android, and Web.
version: 0.6.1
homepage: https://github.com/notalib/flutter_readium
repository: https://github.com/notalib/flutter_readium
issue_tracker: https://github.com/notalib/flutter_readium/issues
topics:
  - readium
  - ebook
  - audiobook
  - comic
  - tts

environment:
  sdk: ">=3.8.0 <4.0.0"
  flutter: '>=3.44.8'

flutter:
  plugin:
    platforms:
      android:
        package: dk.nota.flutterreadium
        pluginClass: FlutterReadiumPlugin
      ios:
        pluginClass: FlutterReadiumPlugin
      macos:
        pluginClass: FlutterReadiumPlugin
      web:
        pluginClass: FlutterReadiumWebPlugin
        fileName: src/flutter_readium_web.dart
  assets:
    - assets/helpers/
    - assets/voice_data/

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  # Same checkout as this plugin. The interface is not published yet with
  # EpubTableOpenEvent, and a version constraint would pull pub.dev, which
  # does not have that type. Upstream still uses ^0.6.1.
  flutter_readium_platform_interface:
    path: ../flutter_readium_platform_interface
  wakelock_plus: ^1.7.0
  web: ^1.1.1
  collection: ^1.19.1
  http: ^1.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  plugin_platform_interface: ^2.0.2
  mocktail: ^1.0.0

executables:
  copy_js_file:
